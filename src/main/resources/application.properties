spring.application.name=composizione-service

# L'URL di connessione al database (Protocollo : Sub-protocollo : // IP : Porta / NomeDB)
spring.datasource.url=jdbc:postgresql://localhost:5432/db_composizione

# Le credenziali di accesso 
spring.datasource.username=postgres
spring.datasource.password=***RIMOSSA***

# Driver che permette a Java di tradurre i comandi per PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Strategia di gestione dello schema (JPA crea/aggiorna le tabelle da solo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
