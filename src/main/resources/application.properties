spring.application.name=composizione-service

# URL di connessione al database (Protocollo : Sub-protocollo : // IP : Porta / NomeDB)
# Variabile d'ambiente DB_URL; se non impostata usa il default per sviluppo locale
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_composizione}

# Credenziali di accesso
# DB_USER ha un default per sviluppo locale; DB_PASSWORD NON ha default -> app non parte se dimenticata (voluto, previene password placeholder in produzione)
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Driver che permette a Java di tradurre i comandi per PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Strategia di gestione dello schema (JPA crea/aggiorna le tabelle da solo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
